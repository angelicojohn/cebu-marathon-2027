# Builds the site and publishes it to GitHub Pages.
# Runs on demand only (Actions tab -> "Deploy to GitHub Pages" -> Run
# workflow), so a push to main does not deploy here as well as to Netlify.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Encrypted repo secret; never committed.
          PUBLIC_MAPBOX_TOKEN: ${{ secrets.PUBLIC_MAPBOX_TOKEN }}
          # Share cards point at the Pages address for this build.
          URL: https://angelicojohn.github.io/cebu-marathon-2027
      - run: node scripts/prefix-base.mjs dist /cebu-marathon-2027
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
